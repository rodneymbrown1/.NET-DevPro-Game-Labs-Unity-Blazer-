# Prerequisites:
#   1. IAM OIDC provider for token.actions.githubusercontent.com (one-time)
#   2. IAM role with S3 write permissions, trusted by the OIDC provider
#   3. GitHub environments "dev" and "prod" with:
#      Secrets:
#        - AWS_ROLE_ARN: the IAM role ARN
#        - PORTAL_BUCKET: full S3 bucket name for the portal
#        - GAME_BUILDS_BUCKET: full S3 bucket name for game builds
#   4. S3 buckets created via CDK (run locally)

name: Deploy

on:
  push:
    branches: [dev, prod]

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Publish Blazor portal
        run: dotnet publish portal/Portal.csproj -c Release

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Deploy portal to S3
        run: |
          aws s3 sync portal/bin/Release/net9.0/publish/wwwroot \
            s3://${{ secrets.PORTAL_BUCKET }} \
            --delete

      - name: Deploy game builds to S3
        run: |
          aws s3 sync games/mcp-unity-1-build-optimized \
            s3://${{ secrets.GAME_BUILDS_BUCKET }}/mcp-unity-1 \
            --delete
